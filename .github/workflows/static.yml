        .layer-1 { background: #e8f5e9; border-color: #4caf50; color: #1b5e20; }
        .layer-2 { background: #f3e5f5; border-color: #9c27b0; color: #4a148c; }
        .layer-3 { background: #e3f2fd; border-color: #2196f3; color: #0d47a1; }
        .arch-arrow {
