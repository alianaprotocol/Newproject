        <section id="part01"><h2>01 制度设计哲学与核心原则</h2><p><strong>核心理念：</strong>让新人 <span class="highlight">进得来</span>、让中层 <span class="highlight">爬得动</span>、让顶层 <span class="highlight">留得住</span>、让事业 <span class="highlight">可传承</span> ——同时确保公司利润安全和印尼合规。</p><div class="danger-box"><strong>⚠️ 印尼合规红线：不可突破的 40%</strong><br>法规依据：印尼贸易部第 32/M-DAG/PER/8/2008 号 | SIUPL 直销牌照严格审查 | APLI 行业标准。<br><strong>三重约束共同指向同一条上限：佣金及奖金总额 ≤ 产品销售价值的 40%。</strong></div></section>

        <section id="part02"><h2>02 五级三阶晋升体系</h2><p><strong>五级：</strong>银级 · 金级 · 铂金 · 钻石 · 双钻石/皇冠<br><strong>三阶：</strong>每个核心级别内增设“高级”阶段，形成 10 级完整阶梯。</p><table><thead><tr><th>头衔</th><th>佣金率</th><th>整组月流水 GV</th></tr></thead><tbody><tr><td>银级（Silver）</td><td>20%</td><td>≥ $2,500</td></tr><tr><td>高级银级（Silver+）</td><td>22%</td><td>≥ $5,000</td></tr><tr><td>金级（Gold）</td><td>25%</td><td>≥ $12,500</td></tr><tr><td>高级金级（Gold+）</td><td>27%</td><td>≥ $25,000</td></tr><tr><td>铂金（Platinum）</td><td>30%</td><td>≥ $50,000</td></tr><tr><td>高级铂金（Platinum+）</td><td>32%</td><td>≥ $100,000</td></tr><tr><td>钻石（Diamond）</td><td>33%</td><td>≥ $200,000</td></tr><tr><td>高级钻石（Diamond+）</td><td>34%</td><td>≥ $350,000</td></tr><tr><td>双钻石（Double Diamond）</td><td>35%</td><td>≥ $500,000</td></tr><tr><td>皇冠（Crown）</td><td>35%</td><td>≥ $1,000,000</td></tr></tbody></table></section>

        <section id="part03"><h2>03 收入引擎总览</h2><p><strong>核心拨出 = 1 + 2 + 3 + 4 = 40%</strong> (受印尼法规约束，动态封顶)<br><strong>5 – 9 不占核心拨出</strong>，来自订阅收入或公司净利润。</p></section>
        
        <section id="part04"><h2>04 个人销售佣金：统一零售价机制</h2><p>客户支付 $250 → 平台统一收款 → 系统即时计算 → 经销商电子钱包 (20%-35% 实时到账)。</p></section>
        
        <section id="part05"><h2>05 压缩级差奖金：双轨压缩 · 月结</h2><p>若下级与上级平级或更高级，系统自动 <span class="highlight">“压缩”</span> 跳过该层，向下穿透至最低级别。系统同时计算 <strong>最多 2 条最深压缩线路</strong> 的级差之和。</p></section>
        
        <section id="part06"><h2>06 无限代匹配奖金 · 月结</h2><p>公司额外拿出 <span class="highlight">全球总业绩的 5%</span> 作为匹配奖池。你的下级赚了多少钱，公司 <strong>额外</strong> 支付你该金额的一定比例。<strong>这笔钱不扣下级的收入</strong>。</p></section>
        
        <section id="part07"><h2>07 全球领袖分红池 · 月结</h2><p><strong>三层级联池 · 互不稀释：</strong> 钻石不必与双钻石同池竞争，各池独立，人人有盼头。合计提取月 TSO 的 3.0%。</p></section>
        
        <section id="part08"><h2>08 VIP 订阅永久被动收入 · 周结</h2><p><strong>“焕新俱乐部” · 每月 $39</strong> (不占用 40% 产品拨出额度，从订阅收入中支出)。LTV 阶梯佣金最高可达 28%。</p></section>
        
        <section id="part09"><h2>09 CARAT 双代币系统</h2><div class="warning-box"><strong>⚠️ 合规声明：</strong>CARAT 为内部忠诚度积分，非加密货币，不上链，不公开交易（印尼本地运营框架）。</div><table><thead><tr><th>代币</th><th>获取方式</th><th>功能</th><th>兑现</th></tr></thead><tbody><tr><td><strong>LUSTER</strong><br>(光泽积分)</td><td>购买产品、签到、推荐VIP</td><td>兑换产品/配件、抽稀有款</td><td>不可提现</td></tr><tr><td><strong>CARAT</strong><br>(克拉权益)</td><td>团队业绩、培养新人、月度活跃</td><td>参与分红池、解锁高级别</td><td>公司季度回购</td></tr></tbody></table></section>
        
        <section id="part10"><h2>10 利润分享单元（PSU） ⭐</h2><p><strong>核心设计：</strong>不发放公司股权，发行“利润分享单元”——每一单元代表公司年度净利润的固定比例（0.001%）。经销商通过达成年度业绩目标免费获得。</p></section>
        
        <section id="part11"><h2>11 领导人养老金账户 ⭐</h2><p>为连续活跃的铂金及以上领袖设立虚拟养老金账户，锁定至其“退休”时一次性发放。钻石及以上计提月 GV 的 0.8%。</p></section>
        
        <section id="part12"><h2>12 接班人传承权 ⭐</h2><p><strong>核心设计：</strong>解决 MLM “不可传承”的最大痛点。高阶领袖可将自己的整个团队网络一次性指定传承给继承人。原领袖保留 <span class="highlight">20% 的永久经销商费</span>。</p></section>
        
        <section id="part13"><h2>13 硬性考核红线</h2><div class="danger-box"><strong>🚨 四条底线不可突破。</strong> 70% 终端零售 | 三腿宽深 | 个人活跃度 | 退货扣回。</div></section>
        
        <section id="part14"><h2>14 软着陆保护机制</h2><p><strong>适用级别：</strong>铂金及以上。单月未达标头衔只降 1 级，连续 3 个月未达标才正式降级。</p></section>
        
        <section id="part15"><h2>15 拨出动态封顶：40% 核心风控</h2><p><strong>封顶机制：</strong>总拨出率 = 所有实发奖金总和 ÷ 当月批发总收入。压缩系数：40% ÷ 实际拨出率。</p></section>
        
        <section id="part16"><h2>16 各头衔月收入潜力总览</h2><table><thead><tr><th>头衔</th><th>月收入区间</th><th>核心来源</th></tr></thead><tbody><tr><td>银级</td><td>$1,000 – $2,500</td><td>个人佣金（20%）+ VIP 订阅</td></tr><tr><td>金级</td><td>$2,500 – $6,000</td><td>个人佣金（25%）+ 级差 + 团队积分</td></tr><tr><td>铂金</td><td>$7,000 – $16,000</td><td>30% + 压缩级差 + 匹配 4% + 铂金池 + 养老金</td></tr><tr><td>钻石</td><td>$18,000 – $55,000</td><td>全模块 · 33% + 匹配 6% + 钻石池 + PSU</td></tr><tr><td>双钻石</td><td>$35,000 – $100,000+</td><td>全部模块最高比例 + 传承权（2 人）</td></tr><tr><td>皇冠</td><td class="highlight">$50,000 – $150,000+</td><td>全部模块最高比例 + 匹配 10% + 传承权（3 人）</td></tr></tbody></table></section>
        
        <section id="part17"><h2>17 总拨出演算与单件利润核算</h2><p><strong>成熟期总拨出结构：</strong>个人销售佣金(26%) + 压缩级差(6%) + 匹配奖金(5%) + 分红池(3%) = <span class="highlight">40%</span>。<br><strong>公司单件净利润：</strong>$250 零售价 - $35 成本 - $100 核心拨出 - $37.5 运营 = <span class="text-success">$77.50 (31% 净利率)</span>。</p></section>
        
        <section id="part18"><h2>18 制度核心哲学与速查总表</h2><div class="info-box" style="font-size: 1.1em; line-height: 1.8;">卖一个包赚 <strong>$87.50</strong> 佣金，建两条深线拿 <strong>双倍压缩</strong>，带团队拿 <strong>5% 无限代匹配</strong>，达标进池分 <strong>3% 全球分红</strong>，转 VIP 拿 <strong>28% 月月递增</strong>，攒 CARAT 享回购增值，囤 PSU 享公司利润分红，存养老金退休一次性领取，传网络给后代享 <strong>20% 永久经销商费</strong>。</div></section>

